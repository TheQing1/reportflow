# nginx 配置：托管前端静态产物，并把 /api 反代到后端容器
#
# SSE 是本项目的进度推送通道（GET /api/tasks/{id}/stream），
# 默认反代会缓冲响应，导致进度条"卡住不动直到任务结束"。
# 下面 proxy_buffering off / chunked_transfer_encoding off 是必须的，不是优化。

upstream reportflow_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端：未知路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://reportflow_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 必需 ----
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        # 一份研报要跑几分钟，读超时必须留足，否则流被中途掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源长缓存；index.html 不缓存，避免发版后用户拿到旧壳
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
