name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 手动触发
  workflow_dispatch:

# 同一分支的新推送会取消旧运行，省 CI 时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 后端
  backend:
    name: 后端 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查 (ruff)
        working-directory: backend
        run: ruff check .

      # 格式也进 CI：Makefile 的 `fmt` 与 pre-commit 都在格式化，
      # 但如果 CI 只跑 `ruff check`，格式化就永远是"靠自觉"。
      - name: 格式检查 (ruff format)
        working-directory: backend
        run: ruff format --check .

      # mypy 只检查声明了 strict 的两层（contracts / core）。
      # 不全仓开 strict 是刻意的：其余层与第三方库的 Any 交互太多，
      # 强开只会产生大量 noise，反而没人看。这两层是域模型与配置，值得严。
      - name: 类型检查 (mypy strict 层)
        working-directory: backend
        run: mypy app/contracts app/core

      - name: 测试 + 覆盖率
        working-directory: backend
        # 全部测试用 fake/scripted LLM，不联网、不需要 API Key
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 前端
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------- 镜像
  # 单独验证 Dockerfile 能构建：CI 不跑的话，Dockerfile 往往在很久之后
  # 才被人发现是坏的。
  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: backend/Dockerfile
            image: reportflow-backend
          - dockerfile: frontend/Dockerfile
            image: reportflow-frontend
    steps:
      - uses: actions/checkout@v4

      - name: 构建 ${{ matrix.image }}
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:ci .
