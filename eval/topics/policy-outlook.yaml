id: policy-outlook
topic: 储能政策机制与 2026 年展望
sections: 4
notes: 规划目标不等于已实现，是典型混淆点
must_cover:
  - 国家发改委、国家能源局联合印发的行动方案提出，到2027年全国新型储能装机规模达到1.8亿千瓦以上
  - 2025年共有23个省级行政区出台了储能容量补偿或容量租赁价格政策
  - 预计2026年新型储能新增装机6000万千瓦，增速回落至25%左右
  - 2025年已有14个省份开展电力现货市场长周期结算试运行
