id: cig-scale
topic: 工商业储能的装机规模与增长节奏
sections: 4
notes: 规模口径题，考数字准确性
must_cover:
  - 2025年工商业储能新增装机约8.4GWh，同比增长62%
  - 工商业储能占新型储能新增装机的比重约为17%
  - 预计2026年工商业储能新增装机达到13GWh，增速回落至55%附近
  - 截至2025年底全国新型储能累计装机达到1.36亿千瓦，同比增长84%
