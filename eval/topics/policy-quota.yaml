id: policy-quota
topic: 新能源配储比例要求与执行
sections: 3
notes: 比例+时长是一对参数，只写对一个也算错
must_cover:
  - 山东、宁夏、新疆等省份将新能源配储比例要求提高到装机容量的20%、时长4小时
  - 国家发改委、国家能源局联合印发的行动方案提出，到2027年全国新型储能装机规模达到1.8亿千瓦以上
  - 2025年电网侧储能新增装机2100万千瓦，占新型储能新增装机的44%
must_cite:
  - doc_01_policy_national
  - doc_02_policy_local
  - doc_06_scale_grid
forbidden:
  - 多省将新能源配储比例要求提高到15%、时长2小时
  - 到2027年全国新型储能装机达到3.8亿千瓦
