id: technology
topic: 储能技术路线：锂电、钠电与液流
sections: 4
notes: 三条路线成熟度差异极大，考「不要把示范写成商用」
must_cover:
  - 磷酸铁锂电池在新型储能装机中的占比达到96.5%，仍是最主流路线
