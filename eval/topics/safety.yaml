id: safety
topic: 储能电站安全与标准体系
sections: 3
notes: 事故数据 + 标准收紧 + 低价对安全的挤压
must_cover:
  - 2025年国内公开报道的储能电站火灾事故共7起，其中6起发生在投运3年以内的项目
  - 新版《电化学储能电站安全规程》要求消防系统独立配置并具备远程联动能力
  - 低价竞争导致部分项目中标价低于成本线，交付质量风险上升
must_cite:
  - doc_15_safety
  - doc_20_risk
forbidden:
  - 2025年国内公开报道的储能电站火灾事故共3起
  - 新版安全规程不再要求消防系统独立配置
