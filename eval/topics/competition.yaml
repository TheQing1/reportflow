id: competition
topic: 储能系统集成的竞争格局与盈利压力
sections: 4
notes: 集中度低 + 价格战 + 毛利率下滑，三个判断互相印证
must_cover:
  - 2025年储能系统集成环节CR5约为38%，较上一年提升4个百分点
  - 2025年新增储能项目中约45%由非头部企业承接，中小集成商仍以低价策略抢份额
  - 2025年储能系统均价降至0.48元/Wh，同比下降31%
  - 储能系统集成商平均毛利率降至18.6%，同比下降2.1个百分点
