id: policy-target
topic: 储能国家规划目标与配储要求
sections: 4
notes: 规划目标 vs 已实现规模，容易混淆
must_cover:
  - 国家发改委、国家能源局联合印发的行动方案提出，到2027年全国新型储能装机规模达到1.8亿千瓦以上
  - 山东、宁夏、新疆等省份将新能源配储比例要求提高到装机容量的20%、时长4小时
  - 2025年工商业储能补贴政策覆盖12个省份，单个项目最高补贴300元/千瓦
  - 截至2025年底全国新型储能累计装机达到1.36亿千瓦，同比增长84%
must_cite:
  - doc_01_policy_national
  - doc_02_policy_local
  - doc_03_scale_overall
forbidden:
  - 到2027年全国新型储能装机规模达到2.8亿千瓦以上
  - 配储比例要求普遍为装机容量的10%
