id: fire-safety
topic: 储能电站事故特征与安全规程
sections: 4
notes: 事故的时间特征（投运3年内）是反直觉点
must_cover:
  - 2025年国内公开报道的储能电站火灾事故共7起，其中6起发生在投运3年以内的项目
  - 新版《电化学储能电站安全规程》要求消防系统独立配置并具备远程联动能力
  - 磷酸铁锂电池在新型储能装机中的占比达到96.5%，仍是最主流路线
must_cite:
  - doc_15_safety
  - doc_11_tech_lfp
forbidden:
  - 2025年国内公开报道的储能电站火灾事故共17起
  - 事故集中发生在投运5年以上的项目
