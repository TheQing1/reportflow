id: industry-overview
topic: 中国储能行业全景：规模、格局与展望
sections: 5
notes: 综合题，5 章需要跨 4 篇以上文档
must_cover:
  - 截至2025年底全国新型储能累计装机达到1.36亿千瓦，同比增长84%
  - 2025年新型储能新增装机4800万千瓦，连续三年位居全球第一
  - 2025年储能系统集成环节CR5约为38%，较上一年提升4个百分点
  - 2025年储能系统均价降至0.48元/Wh，同比下降31%
  - 预计2026年新型储能新增装机6000万千瓦，增速回落至25%左右
