id: spot-market
topic: 电力现货市场对储能收益的重塑
sections: 4
notes: 试点省份数、价差金额两处都容易写偏
must_cover:
  - 2025年已有14个省份开展电力现货市场长周期结算试运行
  - 调频辅助服务补偿标准在山西约为8元/千瓦，广东约为6元/千瓦
  - 峰谷套利仍是最主要收益来源，占工商业储能项目收益的70%以上
  - 2025年浙江一般工业电价峰谷价差约0.95元/kWh，广东约0.85元/kWh，江苏约0.72元/kWh
