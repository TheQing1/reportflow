id: aux-service
topic: 调频辅助服务与储能收益补充
sections: 3
notes: 辅助服务是收益的补充项，不能写成为主项
must_cover:
  - 调频辅助服务补偿标准在山西约为8元/千瓦，广东约为6元/千瓦
  - 2025年已有14个省份开展电力现货市场长周期结算试运行
  - 峰谷套利仍是最主要收益来源，占工商业储能项目收益的70%以上
must_cite:
  - doc_17_market
  - doc_16_business_model
forbidden:
  - 山西调频辅助服务补偿标准约12元/千瓦
  - 2025年已有24个省份开展电力现货长周期结算试运行
