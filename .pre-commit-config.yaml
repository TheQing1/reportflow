# pre-commit：把"靠自觉"的约束变成提交前的自动检查
#
#   pip install pre-commit && pre-commit install
#
# 本项目有一条靠人守不住的架构约束（分层依赖方向），
# 它由 tests/test_layering.py 在 CI 里用 AST 强制校验，不放在这里——
# 因为那需要完整的包环境，而 pre-commit hook 应该秒级返回。

default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 backend/requirements-dev.txt 装到的 ruff 版本保持一致。
    # 差距过大时 pre-commit 放过的代码会在 `ruff format --check` 下失败，
    # 因为格式化规则随版本演进 —— 于是出现"本地绿的、CI 红的"。
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]        # 能自动修的先修（未使用导入等）
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]   # 语料都是文本，2MB 已经异常
      # 密钥兜底：阻止 .env 被误提交
      - id: detect-private-key

  # mypy 只在本地跑（CI 里由 workflow 覆盖），且只查声明了 strict 的两层。
  # 用途不同：ruff 管格式、mypy 管类型，后者慢一些但能在提交前拦住
  # "参数名改了但调用方没改"这类 ruff 看不见的错误。
  - repo: local
    hooks:
      - id: mypy-strict-layers
        name: mypy (contracts + core, strict)
        entry: python -m mypy
        language: system
        files: ^backend/(app/contracts|app/core)/.*\.py$
        pass_filenames: false
        args: [app/contracts, app/core]
        # 必须在 backend/ 下执行才能读到 pyproject.toml 的 mypy 配置
        require_serial: true
        stages: [pre-commit]
